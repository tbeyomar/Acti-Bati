<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Acti Bati</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F3EFE8;--ink:#14172A;--ink-soft:#5B5D69;--line:rgba(20,23,42,.14);--red:#D01154}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{padding:22px clamp(16px,4vw,56px)}
  header img{height:46px;width:auto;display:block}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(16px,4vw,56px) 60px;max-width:900px}
  .code{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:clamp(36px,6vw,72px);line-height:1;letter-spacing:-.02em;margin:0 0 18px}
  h1 em{color:var(--red)}
  p{color:var(--ink-soft);font-size:16px;line-height:1.6;margin:0 0 30px;max-width:480px}
  .links{display:flex;flex-wrap:wrap;gap:12px}
  .links a{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:40px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:#fff;transition:border-color .2s,color .2s}
  .links a:hover{border-color:var(--red);color:var(--red)}
  .links a.main{background:var(--ink);color:#fff;border-color:var(--ink)}
  .links a.main:hover{background:var(--red);border-color:var(--red);color:#fff}
</style>
</head>
<body>
<header><a href="/" aria-label="Acti Bati — accueil"><img src="/assets/logo-actibati-sm.webp" alt="Acti Bati" width="146" height="120"></a></header>
<main>
  <div class="code">Erreur 404</div>
  <h1>Cette page <em>n'existe pas.</em></h1>
  <p>Le lien est peut-être incomplet. Retrouvez nos programmes ci-dessous.</p>
  <div class="links">
    <a class="main" href="/">Tous les programmes →</a>
    <a href="/roussillon41/">Parc Roussillon S41</a>
    <a href="/ateliers/">Acti-Sud Nîmes</a>
  </div>
</main>
</body>
</html>
